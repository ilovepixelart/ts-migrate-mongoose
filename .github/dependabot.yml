version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Version updates only; security updates are never delayed.
    cooldown:
      semver-major-days: 7
    groups:
      # A dependency joins the first group it matches, so specific groups come first.
      # These packages pin each other with peer ranges and fail npm ci when one
      # moves alone, so every update, majors included, moves as one set.
      nestjs:
        patterns: ["@nestjs/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
