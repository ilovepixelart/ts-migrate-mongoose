version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Version updates wait 7 days; security updates are never delayed.
    cooldown:
      default-days: 7
    # @types/node stays on the oldest Node line the toolchain accepts (vitest 5 needs 22), the
    # closest to engines (>=20); a newer major would let code compile against APIs older
    # supported runtimes lack, so majors move only deliberately.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # A dependency joins the first group it matches, so specific groups come first.
      # These packages pin each other with peer ranges and fail npm ci when one
      # moves alone, so every update, majors included, moves as one set.
      nestjs:
        patterns: ["@nestjs/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Version updates wait 7 days; security updates are never delayed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
