name: Publish

on:
  release:
    types:
      - published

# Read by default; jobs upgrade to the minimal scopes they need.
permissions:
  contents: read

jobs:
  build:
    name: Build, attest, and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write             # OIDC token for Sigstore keyless signing
      attestations: write         # persist the build provenance attestation
      artifact-metadata: write    # create the artifact storage record that backs the attestation
    outputs:
      tarball-name: ${{ steps.pack.outputs.tarball-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type:check

      - name: Type check tests
        run: npm run type:check:tests

      - name: Biome
        run: npm run biome

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Pack tarball
        id: pack
        run: |
          set -euo pipefail
          npm pack
          tarball=$(ls -1 ts-migrate-mongoose-*.tgz | head -n1)
          echo "tarball-name=$tarball" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        # actions/attest is the canonical action per the docs; actions/attest-build-provenance
        # is now a thin wrapper around it. Default predicate type is SLSA v1 build provenance,
        # which is what we want for npm tarballs — no extra inputs needed.
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ steps.pack.outputs.tarball-name }}

      - name: Upload tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: ${{ steps.pack.outputs.tarball-name }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # npm provenance attestation via OIDC trusted publisher
    steps:
      - name: Use Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Download tarball artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball

      - name: Publish to npm
        run: npm publish "${{ needs.build.outputs.tarball-name }}"
