name: Publish

on:
  release:
    types:
      - published
  # Recovery path for an undelivered release event. Every job checks out the tag
  # itself and the check job fails unless the tag equals the package.json version, so
  # a dispatch publishes the tagged commit rather than whatever main holds.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.2.3)"
        required: true

# Read by default; jobs upgrade to the minimal scopes they need.
permissions:
  contents: read

# One publish at a time, and never cancel one that has started.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # The check runs the dev toolchain (vitest, biome, tsc) and every devDependency it
  # loads, so it holds no token: a compromised one cannot mint the OIDC token the build
  # signs with or touch the tarball before it is packed and attested.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag, not the default branch: a dispatch recovery run must check the
          # commit the tag names.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      # No cache anywhere in this workflow: a poisoned cache would reach the published tarball.
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Verify the tag matches package.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$RELEASE_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match package.json ($pkg); bump the version before tagging." >&2
            exit 1
          fi

      # No dependency install scripts: none is needed, and the MongoDB binary the tests use
      # (mongodb-memory-server) downloads on first use.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run type:check

      - name: Type check tests
        run: npm run type:check:tests

      - name: Biome
        run: npm run biome

      - name: Test
        run: npm run test

  build:
    name: Build, attest, and pack
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write             # upload the attestation sidecars to the triggering release
      id-token: write             # OIDC token for Sigstore keyless signing
      attestations: write         # persist the build provenance attestation
      artifact-metadata: write    # create the artifact storage record that backs the attestation
    outputs:
      tarball-name: ${{ steps.pack.outputs.tarball-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag, not the default branch: a dispatch recovery run must build the
          # commit the tag names.
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false

      # This job holds id-token: write, so no dependency install script runs here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Pack tarball
        id: pack
        run: |
          set -euo pipefail
          npm pack
          shopt -s nullglob
          tarballs=(*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected one tarball, found ${#tarballs[@]}." >&2
            exit 1
          fi
          tarball="${tarballs[0]}"
          echo "tarball-name=$tarball" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        # actions/attest is the canonical action per the docs; actions/attest-build-provenance
        # is now a thin wrapper around it. Default predicate type is SLSA v1 build provenance,
        # which is what we want for npm tarballs, so no extra inputs are needed.
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball-name }}

      - name: Attach attestation bundles to release
        # SLSA v1.2 recommends publishing provenance in more than one channel.
        # actions/attest already uploaded the Sigstore bundle to GitHub's native
        # attestation store and npm ships an npm-registry provenance attestation
        # via publishConfig.provenance: true. This step adds two more channels,
        # both sidecar files on the GitHub Release carrying the same DSSE
        # envelope at the innermost layer but in different outer containers
        # for different verification flows:
        #
        # 1. <tarball>.sigstore.json: the full Sigstore bundle produced by
        #    actions/attest (application/vnd.dev.sigstore.bundle.v0.3+json).
        #    Includes the Fulcio certificate and the Rekor inclusion proof,
        #    so consumers can verify offline without querying Rekor. Parsed
        #    by `gh attestation verify --bundle` and other Sigstore-native
        #    tooling.
        #
        # 2. <tarball>.intoto.jsonl: a spec-compliant in-toto attestation v1
        #    bundle (https://github.com/in-toto/attestation/blob/main/spec/v1/bundle.md):
        #    JSON Lines of DSSE envelopes, one envelope per line. Extracted
        #    from the Sigstore bundle via `jq -c .dsseEnvelope`, NOT a
        #    renamed Sigstore bundle. Verified by `slsa-verifier
        #    verify-artifact`, which queries Rekor for the cert and
        #    inclusion proof via the signature hash.
        #
        # Both files carry the same signature over the same SLSA v1 payload
        # (predicateType https://slsa.dev/provenance/v1). The split is about
        # serving two different consumer verification flows, not duplicating
        # trust material. The `.intoto.jsonl` shape is also what OpenSSF
        # Scorecard's `releasesHaveProvenance` probe looks for on the
        # release-asset channel.
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          TARBALL: ${{ steps.pack.outputs.tarball-name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          # 1. Full Sigstore bundle: straight copy of actions/attest output.
          sigstore="${TARBALL}.sigstore.json"
          cp "$BUNDLE_PATH" "$sigstore"

          # 2. In-toto attestation bundle: JSON Lines of DSSE envelopes.
          #    `jq -c` emits a single-line JSON object, which by definition
          #    is also a valid one-line JSONL document. The Sigstore bundle's
          #    dsseEnvelope field is already a standard DSSE envelope
          #    (payload, payloadType, signatures) so no shape transformation
          #    is needed beyond the projection.
          intoto="${TARBALL}.intoto.jsonl"
          jq -c '.dsseEnvelope' "$BUNDLE_PATH" > "$intoto"

          gh release upload "$RELEASE_TAG" "$sigstore" "$intoto" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload tarball artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: ${{ steps.pack.outputs.tarball-name }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write     # npm provenance attestation via OIDC trusted publisher
    steps:
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download tarball artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball

      # A recovery dispatch for a version already on npm ends green instead of
      # failing on the duplicate publish.
      - name: Publish to npm
        env:
          TARBALL: ${{ needs.build.outputs.tarball-name }}
        run: |
          set -euo pipefail
          spec=$(tar -xOzf "$TARBALL" package/package.json | jq -r '.name + "@" + .version')
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already published; skipping."
            exit 0
          fi
          npm publish "$TARBALL"
