name: PR check

on:
  workflow_dispatch:
  # Trigger on push to main or pull requests
  push:
    branches:
      - main
      - feature*

  pull_request:
    types: [opened, synchronize, reopened]

# Declare default permissions as read only. No job in this workflow writes to
# the repo — tests, biome, type-check, coverage, and SonarCloud all run in
# read-only mode. SonarCloud PR decorations come from the SonarCloud GitHub
# App, not GITHUB_TOKEN write scopes.
permissions:
  contents: read

jobs:
  tests:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [20.x, 22.x]
        mongoose-version: [mongoose@6.12.2, mongoose@7.6.4, mongoose@8.23.0, mongoose@9.4.1]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Installing dependencies
        run: npm ci

      - name: Installing ${{ matrix.mongoose-version }}
        run: npm i ${{ matrix.mongoose-version }}

      - name: Type check
        run: npm run type:check

      - name: Coverage
        run: npm run test
  sonar:
    name: Biome, Coverage & Sonar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Installing dependencies
        run: npm ci

      - name: Verify provenance signatures
        run: npm audit signatures

      - name: Biome
        run: npm run biome

      - name: Type check tests
        run: npm run type:check:tests

      - name: Coverage
        run: npm run test

      - name: Scan
        if: env.SONAR_TOKEN
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=ilovepixelart
            -Dsonar.projectName=ts-migrate-mongoose
            -Dsonar.projectKey=ilovepixelart_ts-migrate-mongoose
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.test.exclusions=tests/**
            -Dsonar.coverage.exclusions=tests/**
